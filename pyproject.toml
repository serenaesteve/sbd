[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbd"
version = "3.2.0"
description = "Base de datos con lenguaje propio en español: motor, servidor con API, panel web y clientes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Serena", email = "serenaestevee@gmail.com" }]
keywords = ["base de datos", "español", "lenguaje de consultas"]
classifiers = [
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Topic :: Database :: Database Engines/Servers",
]

[project.scripts]
sbd = "sbd.cli:main"

[tool.setuptools]
packages = ["sbd", "sbd.web"]

[tool.setuptools.package-data]
"sbd.web" = ["static/*"]
