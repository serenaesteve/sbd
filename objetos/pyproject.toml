[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baul"
version = "1.0.0"
description = "Base de datos de objetos de Python, en YAML o en SBD. Se instala junto a SBD: pip install . ./objetos"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools]
packages = ["baul", "biblioteca"]

[tool.setuptools.package-data]
biblioteca = ["estatico/*"]
