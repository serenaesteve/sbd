<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baúl · SBD</title>
  <meta name="description" content="El Baúl: una base de datos de objetos guardada en SBD. Recorre el grafo de objetos de una biblioteca.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f6f1e4'/%3E%3Crect x='5' y='11' width='22' height='15' fill='%231d2230'/%3E%3Cpath d='M5 11q11-9 22 0' fill='none' stroke='%23c33' stroke-width='2.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;1,6..72,400;1,6..72,500&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <a class="salto" href="#ficha">Ir a la ficha</a>
  <header class="cabecera">
    <div>
      <p class="migas"><a href="../">SBD</a> <span aria-hidden="true">›</span> objetos</p>
      <h1>Baúl</h1>
      <p class="subtitulo">Una base de datos de objetos. No hay tablas: cada objeto guarda sus datos y apunta a otros objetos. Pulsa una referencia para seguirla.</p>
    </div>
    <p class="quien" id="quien" role="status"></p>
  </header>
  <div class="mesa">
    <nav class="clases" aria-labelledby="titulo-clases">
      <h2 id="titulo-clases">Clases</h2>
      <ul id="clases"></ul>
      <h2>Raíces</h2>
      <ul id="raices"></ul>
    </nav>
    <section class="lista" aria-labelledby="titulo-lista">
      <form class="consulta" id="consulta">
        <label for="tipo-consulta">consulta por ejemplo</label>
        <div class="consulta-fila">
          <select id="tipo-consulta">
            <option value="autor">libros cuyo autor contiene</option>
            <option value="genero">publicaciones del género</option>
            <option value="ciudad">socios que viven en</option>
            <option value="barato">publicaciones que cuestan menos de</option>
          </select>
          <input id="valor-consulta" required maxlength="80" placeholder="borges" autocomplete="off" spellcheck="false">
          <button class="boton" type="submit">buscar</button>
        </div>
      </form>
      <h2 id="titulo-lista">—</h2>
      <code class="llamada" id="llamada-lista"></code>
      <ul class="objetos" id="objetos"></ul>
    </section>
    <main class="ficha" id="ficha" tabindex="-1" aria-live="polite"></main>
  </div>
  <footer class="pie"><p>Datos de ejemplo: socios y préstamos inventados. <span id="conexion"></span></p></footer>
  <script src="app.js"></script>
</body>
</html>
